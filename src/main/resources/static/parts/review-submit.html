<!-- VIEW 13: REVIEW SUBMISSION -->
<section id="view-review-submit" class="view-section d-none">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-6">
            <div class="card p-4 shadow-sm border-0">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h4 class="fw-bold mb-0"><i class="bi bi-star-fill me-2 text-warning"></i>Doctor Feedback & Review</h4>
                    <span class="badge bg-primary">Review</span>
                </div>
                <p class="text-muted small">Share your experience with the hospital medical staff</p>

                <form id="reviewSubmissionForm">
                    <input type="hidden" id="review-patient-id" value="PAT-101">

                    <div class="mb-3">
                        <label class="form-label">Doctor *</label>
                        <select id="review-doctor-id" class="form-select" required>
                            <option value="">-- Choose Doctor --</option>
                        </select>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Star Rating *</label>
                            <select id="review-rating" class="form-select">
                                <option value="5">★★★★★ (5 Stars - Excellent)</option>
                                <option value="4">★★★★☆ (4 Stars - Very Good)</option>
                                <option value="3">★★★☆☆ (3 Stars - Average)</option>
                                <option value="2">★★☆☆☆ (2 Stars - Needs Improvement)</option>
                                <option value="1">★☆☆☆☆ (1 Star - Poor)</option>
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Review Type</label>
                            <select id="review-type" class="form-select">
                                <option value="VerifiedReview">VerifiedReview (Treated Patient)</option>
                                <option value="PatientReview">PatientReview (Community)</option>
                            </select>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Appointment ID (if verified)</label>
                            <input type="text" id="review-apt-id" class="form-control" placeholder="e.g. APT-101">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Treatment Tag</label>
                            <input type="text" id="review-treatment" class="form-control" placeholder="e.g. Cardiology OPD">
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label">Comment / Feedback *</label>
                        <textarea id="review-comment" class="form-control" rows="3" placeholder="Describe the consultation quality, punctuality, and staff bedside manner..." required></textarea>
                    </div>

                    <button type="submit" class="btn btn-teal w-100 py-2 fw-semibold">
                        <i class="bi bi-send me-1"></i>Submit Feedback
                    </button>
                </form>
            </div>
        </div>
    </div>
</section>
