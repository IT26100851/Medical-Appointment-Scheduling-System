<!-- VIEW 16: ADMIN - PATIENT MANAGEMENT CRUD -->
<section id="view-patient-management" class="view-section d-none">
    <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap">
        <h4 class="fw-bold"><i class="bi bi-people-fill me-2 text-primary"></i>Patient Management</h4>
        <a href="#register" class="btn btn-teal btn-sm"><i class="bi bi-person-plus me-1"></i>Add Patient</a>
    </div>

    <div class="card p-2 mb-3 border-0 shadow-sm">
        <div class="input-group">
            <span class="input-group-text bg-white"><i class="bi bi-search"></i></span>
            <input type="text" class="form-control" placeholder="Search patients..." oninput="loadAdminPatients(this.value)">
        </div>
    </div>

    <div class="card shadow-sm border-0">
        <div class="table-responsive">
            <table class="table table-hover mb-0">
                <thead>
                    <tr>
                        <th>Patient ID</th>
                        <th>Username</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th>Type</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="admin-patients-tbody"></tbody>
            </table>
        </div>
    </div>
</section>
