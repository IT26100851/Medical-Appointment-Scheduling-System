<!-- VIEW 2: PATIENT REGISTRATION -->
<section id="view-register" class="view-section d-none">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card p-4 shadow-sm border-0">
                <div class="text-center mb-4">
                    <div class="stat-icon bg-primary text-white mx-auto mb-2">
                        <i class="bi bi-person-plus-fill"></i>
                    </div>
                    <h3 class="fw-bold">Patient Registration</h3>
                    <p class="text-muted small">Join CareSync Medical System to schedule appointments</p>
                </div>
                <form id="patientRegistrationForm">
                    <div class="mb-3">
                        <label class="form-label">Full Name *</label>
                        <input type="text" id="reg-name" class="form-control" placeholder="e.g. Ruwan Silva" required>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Username *</label>
                            <input type="text" id="reg-username" class="form-control" placeholder="Choose username" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Password *</label>
                            <input type="password" id="reg-password" class="form-control" placeholder="Min 3 characters" required>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Email Address *</label>
                            <input type="email" id="reg-email" class="form-control" placeholder="name@domain.com" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Phone Number *</label>
                            <input type="tel" id="reg-phone" class="form-control" placeholder="07XXXXXXXX" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Address</label>
                        <input type="text" id="reg-address" class="form-control" placeholder="Street, City">
                    </div>
                    <div class="mb-4">
                        <label class="form-label">Membership Tier (OOP Subclass)</label>
                        <select id="reg-type" class="form-select">
                            <option value="Regular">Regular Patient (Standard Service)</option>
                            <option value="VIP">VIP Patient (15% Discount on Consultations)</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-teal w-100 py-2 fw-semibold">
                        Complete Registration
                    </button>
                    <div class="text-center mt-3">
                        <small class="text-muted">Already registered? <a href="#login">Login here</a></small>
                    </div>
                </form>
            </div>
        </div>
    </div>
</section>
