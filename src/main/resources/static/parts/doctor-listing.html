<!-- VIEW 6 & 7: DOCTOR LISTING & SEARCH -->
<section id="view-doctor-listing" class="view-section d-none">
    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap">
        <div>
            <h3 class="fw-bold mb-1"><i class="bi bi-heart-pulse-fill me-2 text-primary"></i>Medical Doctors & Specialists</h3>
            <p class="text-muted small mb-0">Browse general doctors, board-certified specialists, and surgeons</p>
        </div>
    </div>

    <!-- Filter and Search Toolbar -->
    <div class="card p-3 mb-4 shadow-sm border-0">
        <div class="row g-2">
            <div class="col-md-6">
                <div class="input-group">
                    <span class="input-group-text bg-white"><i class="bi bi-search"></i></span>
                    <input type="text" id="search-doctor-input" class="form-control" placeholder="Search by doctor name or specialization...">
                </div>
            </div>
            <div class="col-md-3">
                <select id="filter-doctor-spec" class="form-select">
                    <option value="">All Specializations</option>
                    <option value="Cardiology">Cardiology</option>
                    <option value="General Medicine">General Medicine</option>
                    <option value="Orthopedics">Orthopedics</option>
                    <option value="Pediatrics">Pediatrics</option>
                    <option value="Dermatology">Dermatology</option>
                </select>
            </div>
            <div class="col-md-3">
                <button class="btn btn-teal w-100" onclick="loadDoctorsList()">
                    <i class="bi bi-arrow-clockwise me-1"></i>Reset Filters
                </button>
            </div>
        </div>
    </div>

    <!-- Doctors Grid -->
    <div class="row" id="doctors-grid"></div>
</section>
