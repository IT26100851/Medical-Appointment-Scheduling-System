<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CareSync - Medical Appointment Scheduling System</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Custom Healthcare Styling -->
    <link href="/css/style.css" rel="stylesheet">
</head>
<body>
    <!-- Top Navigation & Role Bar (Loaded from /parts/navbar.html) -->
    <div id="navbar-container"></div>

    <!-- Main Container: Modular Views (Loaded from /parts/*.html) -->
    <main class="container my-4 flex-grow-1" id="main-content">
        <div id="app-loader" class="text-center py-5">
            <div class="spinner-border text-teal" role="status">
                <span class="visually-hidden">Loading application modules...</span>
            </div>
            <p class="text-muted small mt-2">Initializing CareSync Medical Center Modules...</p>
        </div>
    </main>

    <!-- Modals (Loaded from /parts/modals.html) -->
    <div id="modals-container"></div>

    <!-- Toast Notifications Container -->
    <div id="toast-container"></div>

    <!-- Footer (Loaded from /parts/footer.html) -->
    <div id="footer-container"></div>

    <!-- Bootstrap 5 Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- App Client Script -->
    <script src="/js/app.js"></script>
</body>
</html>
